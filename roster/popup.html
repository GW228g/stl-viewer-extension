<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STL Viewer settings</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>STL Viewer for Google Classroom</h1>

  <label class="option">
    <span class="text">
      <b>Print checklist</b>
      <small>Adds a "Print checklist" button to an assignment's Student work page. It makes a
      one-page list of every student and their STL file, grouped by color, for print planning.</small>
    </span>
    <input type="checkbox" id="roster" class="switch" role="switch">
  </label>

  <details class="advanced">
    <summary>Advanced</summary>
    <label class="option">
      <span class="text">
        <b>Troubleshooting tool</b>
        <small>Adds a small "Copy page structure" button to Classroom pages. It copies the page's layout
        with all names and text removed, to help fix the checklist if Classroom changes its page.</small>
      </span>
      <input type="checkbox" id="debug" class="switch" role="switch">
    </label>
  </details>

  <p class="note">Student names are only read in your browser to build the list. Nothing is sent anywhere or saved.</p>

  <script src="popup.js"></script>
</body>
</html>
