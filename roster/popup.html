<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STL Viewer settings</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>STL Viewer for Google Classroom</h1>

  <label class="option">
    <span class="text">
      <b>Print checklist</b>
      <small>Adds a "Print checklist" button to an assignment's Student work page. It makes a
      one-page list of every student and their STL file, grouped by color, for print planning.</small>
    </span>
    <input type="checkbox" id="roster" class="switch" role="switch">
  </label>

  <p class="note">Student names are only read in your browser to build the list. Nothing is sent anywhere or saved.</p>

  <script src="popup.js"></script>
</body>
</html>
